name: Daily Forex Fundamentals Report

# Runs on GitHub's free Actions runners (no server to pay for or maintain),
# weekday mornings, and sends the report to Telegram. You can also run it on
# demand from the "Actions" tab in GitHub -> this workflow -> "Run workflow".
on:
  schedule:
    # 12:00 UTC = 7am US Eastern during EST, 8am during EDT (no DST awareness
    # in cron; shift this by 1 hour yourself around the March/November clock
    # changes if you want it pinned to exactly 7am year-round).
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TradingAgents
        run: pip install .

      - name: Run the forex fundamentals analysis
        env:
          # Secrets: set these under Settings -> Secrets and variables ->
          # Actions in your fork. None of them are committed to the repo.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Fixed run settings -> no interactive prompts, safe to hardcode.
          TRADINGAGENTS_LLM_PROVIDER: google
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.5-flash-lite
          # Not gemini-3.8-flash: its free tier caps at 20 requests/day
          # project-wide, which one 3-pair run blows through immediately
          # (confirmed via a 429 RESOURCE_EXHAUSTED quota error, not the
          # transient 503 overload the retry loop below exists for). The
          # flash-lite models get 500 free requests/day instead, so the
          # deep-think slot uses the same model as quick-think.
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.5-flash-lite
          TRADINGAGENTS_OUTPUT_LANGUAGE: English
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
          TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/reports
          TRADINGAGENTS_NO_UPDATE_CHECK: "1"
          # The free tier is rate-limited and sometimes briefly overloaded
          # (Google returns a 503 "high demand" error); ride both out instead
          # of failing the run.
          TRADINGAGENTS_LLM_MAX_RETRIES: "10"
        run: |
          set -uo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          # Edit this list to add/remove pairs. 28 pairs x ~15-20 Gemini
          # calls each sits right up against the free tier's 500
          # requests/day ceiling (shared across the whole run, not
          # per-pair) -- comfortable on a good day, tight if Google is
          # also fielding retries. The quota_exhausted flag below means a
          # single hard RESOURCE_EXHAUSTED stops burning further retries
          # on every remaining pair once the day's budget is gone, rather
          # than grinding through 3 doomed attempts (with 3-minute waits
          # between them) for each one.
          # All 28 pairs from the 8 majors (USD, EUR, GBP, JPY, CHF, AUD,
          # CAD, NZD): NZDCHF and NZDCAD were the two missing from the
          # earlier 26-pair list.
          PAIRS="EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY EURCHF EURCAD EURAUD EURNZD GBPJPY GBPCHF GBPCAD GBPAUD GBPNZD AUDJPY AUDCAD AUDCHF AUDNZD CADJPY CADCHF NZDJPY CHFJPY NZDCHF NZDCAD"
          TOTAL=$(echo $PAIRS | wc -w)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          quota_exhausted=0
          for pair in $PAIRS; do
            if [ "$quota_exhausted" -eq 1 ]; then
              echo "::warning::Skipping $pair -- Gemini's free-tier daily quota (500 requests) is already exhausted for today."
              continue
            fi
            echo "=== $pair ==="
            attempt=1
            output_log=$(mktemp)
            until tradingagents --ticker "$pair" --date "$TODAY" \
                --analysts news,fundamentals --save --no-show 2>&1 | tee "$output_log"; do
              if grep -q "RESOURCE_EXHAUSTED" "$output_log"; then
                echo "::warning::Gemini's free-tier daily quota (500 requests) is exhausted. Skipping every remaining pair for today instead of retrying a budget that won't come back until Google resets it."
                quota_exhausted=1
                break
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::warning::$pair failed 3 times in a row (likely Gemini's free tier being overloaded). Skipping it for today."
                break
              fi
              echo "$pair failed (attempt $attempt/3). Waiting 3 minutes before retrying, in case Gemini is just overloaded right now..."
              sleep 180
              attempt=$((attempt + 1))
            done
            rm -f "$output_log"
          done
        id: run

      - name: Collect the reports into one flat folder
        id: check
        run: |
          # telegram-action resolves its "document" glob with Go's
          # filepath.Glob, which (unlike @actions/upload-artifact's glob)
          # does NOT match "**" recursively across directory levels -- and
          # our reports sit two levels deep (reports/reports/<ticker>_<ts>/
          # complete_report.md, since the framework appends its own
          # "reports" folder under TRADINGAGENTS_RESULTS_DIR). That mismatch
          # silently sent the Telegram message with no file attached. Copying
          # into one flat folder sidesteps glob-engine differences entirely.
          mkdir -p telegram-send
          count=0
          for report in $(find reports -name complete_report.md 2>/dev/null); do
            pair=$(basename "$(dirname "$report")" | cut -d_ -f1)
            cp "$report" "telegram-send/${pair}.md"
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Keep the full reports for 14 days (stats are saved here, not sent to Telegram)
        uses: actions/upload-artifact@v4
        with:
          name: forex-reports
          path: telegram-send/*.md
          retention-days: 14
          if-no-files-found: warn

      - name: Build the Green/Red/Yellow Telegram summary
        if: steps.check.outputs.count != '0'
        id: summary
        run: |
          # Pull just the "Rating" line out of each saved report (e.g.
          # "- Rating: Overweight") and map it to a color so Telegram gets
          # a one-line-per-pair scoreboard instead of a pile of .md files.
          # The full reports with every stat are still kept above as a
          # 14-day GitHub Actions artifact -- nothing is lost, it's just
          # not what gets pushed to the phone.
          text="Forex fundamentals -- ${{ steps.check.outputs.count }}/${{ steps.run.outputs.total }} pairs ($(date -u +%Y-%m-%d))"$'\n'
          for f in $(ls telegram-send/*.md | sort); do
            pair=$(basename "$f" .md)
            rating=$(grep -m1 "^- Rating:" "$f" | sed 's/^- Rating: *//')
            case "$rating" in
              Overweight) emoji="🟢" ;;
              Underweight) emoji="🔴" ;;
              Hold) emoji="🟡" ;;
              *) emoji="⚪"; rating="${rating:-unknown}" ;;
            esac
            text+=$'\n'"${emoji} ${pair}: ${rating}"
          done
          {
            echo "text<<SUMMARY_EOF"
            echo "$text"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send the Green/Red/Yellow summary to Telegram
        if: steps.check.outputs.count != '0'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.summary.outputs.text }}

      - name: Tell Telegram if every pair failed
        if: steps.check.outputs.count == '0'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "Today's forex fundamentals run failed for every pair, most likely Gemini's free tier being overloaded. Check the Actions tab on GitHub for details."
